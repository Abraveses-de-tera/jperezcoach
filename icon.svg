<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2298c9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#2298c9" stroke-width="8"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#2298c9" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Curved path for JOSE PEREZ TEAM -->
  <path id="textArc" d="M 90 240 A 170 170 0 0 1 422 240" fill="none" />
  <text font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8" letter-spacing="4" filter="url(#glow)">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      JOSE PEREZ TEAM
    </textPath>
  </text>

  <!-- Center JP Monogram -->
  <g transform="translate(145, 175)">
    <!-- J -->
    <path d="M 85 20 L 85 140 C 85 175 60 195 25 195 C 5 195 -10 185 -20 175 L -10 145 C -2 155 12 165 25 165 C 45 165 55 152 55 130 L 55 20 Z" 
          fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- P -->
    <path d="M 105 20 L 175 20 C 205 20 225 38 225 68 C 225 98 205 116 175 116 L 135 116 L 135 195 L 105 195 Z M 135 50 L 135 86 L 170 86 C 185 86 195 78 195 68 C 195 58 185 50 170 50 Z" 
          fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Coach Script -->
  <text x="360" y="410" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="46" font-style="italic" fill="#ffffff" text-anchor="middle" transform="rotate(-6 360 410)">
    Coach
  </text>

  <!-- Accent stars / dots -->
  <circle cx="100" cy="275" r="4" fill="#38bdf8" />
  <circle cx="412" cy="275" r="4" fill="#38bdf8" />
</svg>